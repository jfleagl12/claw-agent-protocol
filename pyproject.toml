[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "claw-agent-protocol"
version = "0.2.0"
description = "Read-only personal-data MCP service for Hermes and OpenClaw"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jason Fleagle"}]
dependencies = [
  "mcp>=1.30,<2",
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "msal>=1.31,<2",
  "keyring>=25,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
cap = "cap_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cap_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
